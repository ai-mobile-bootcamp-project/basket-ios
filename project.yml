# XcodeGen spec for Basket. Regenerate the Xcode project with:  xcodegen generate
name: Basket

options:
  bundleIdPrefix: com.basket
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  Basket:
    type: application
    platform: iOS
    sources:
      - path: Basket
        excludes:
          - Info.plist
      - path: BasketCore/Sources/BasketCore
        name: BasketCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.basket.app
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Basket/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Basket
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.shopping
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
        DEVELOPMENT_TEAM: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"

  BasketTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BasketCore/Tests/BasketCoreTests
        name: BasketTests
    dependencies:
      - target: Basket
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.basket.app.tests
        PRODUCT_NAME: "$(TARGET_NAME)"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Basket.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Basket"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  Basket:
    build:
      targets:
        Basket: all
        BasketTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BasketTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
